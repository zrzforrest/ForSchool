<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>制谱器 · ForSchool</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0f13'/%3E%3Crect x='14' y='20' width='6' height='24' rx='2' fill='%235b8def'/%3E%3Crect x='26' y='14' width='6' height='30' rx='2' fill='%237ee0a3'/%3E%3Crect x='38' y='24' width='6' height='20' rx='2' fill='%23d9a13b'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d0f13; --surface:#16181d; --panel:#1b1e25;
    --border:#2a2e39; --border-strong:#363b49;
    --text:#e8eaee; --muted:#98a0ad;
    --accent:#5b8def; --accent-strong:#4a7fe0;
    --green:#7ee0a3; --yellow:#d9a13b; --red:#e06b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden;
  }
  #stage{
    position:absolute; top:0; left:0;
    width:500px; height:375px;
    background:var(--bg); transform-origin:top left; overflow:hidden;
  }
  #topbar{
    position:absolute; top:0; left:0; width:500px; height:44px;
    background:var(--surface); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:5px; padding:0 8px; z-index:5;
  }
  #home-btn{
    flex:none; height:26px; padding:0 8px;
    font-size:12px; color:var(--text);
    background:var(--panel); border:1px solid var(--border);
    border-radius:5px; cursor:pointer; text-decoration:none;
    display:inline-flex; align-items:center;
  }
  #home-btn:hover{border-color:var(--border-strong);}
  #title{font-size:13px; font-weight:700; flex:none;}
  .ctl{
    flex:none; display:inline-flex; align-items:center; gap:3px;
    font-size:11px; color:var(--muted);
  }
  .ctl input{
    width:42px; height:24px; font-size:11px; text-align:center;
    color:var(--text); background:var(--panel);
    border:1px solid var(--border); border-radius:4px; font-family:inherit;
  }
  .ctl input:focus{outline:none; border-color:var(--accent);}
  .btn{
    flex:none; height:26px; padding:0 8px;
    font-size:11px; font-weight:600; color:var(--text);
    background:var(--panel); border:1px solid var(--border);
    border-radius:5px; cursor:pointer; white-space:nowrap;
  }
  .btn:hover{border-color:var(--border-strong); background:#21242d;}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-strong);}
  .btn.on{background:var(--green); border-color:var(--green); color:#0d0f13;}
  #time-display{
    margin-left:auto; font-size:11px; color:var(--muted);
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  #time-display b{color:var(--text); font-size:12px;}
  #canvas{
    position:absolute; top:44px; left:0;
    width:500px; height:311px;
    background:#0a0c10; cursor:crosshair;
  }
  #panel{
    position:absolute; top:44px; left:0; width:500px; height:331px;
    background:rgba(10,12,16,.96); display:none; flex-direction:column;
    padding:14px; gap:8px; z-index:20;
  }
  #panel.show{display:flex;}
  #panel h3{font-size:14px; font-weight:700;}
  #panel textarea{
    flex:1; width:100%;
    font-family:"Cascadia Code","Consolas",monospace; font-size:11px;
    color:var(--text); background:var(--panel);
    border:1px solid var(--border); border-radius:6px;
    padding:8px; resize:none; line-height:1.4;
  }
  #panel textarea:focus{outline:none; border-color:var(--accent);}
  #panel-actions{display:flex; gap:8px; justify-content:flex-end;}
  #hint-bar{
    position:absolute; bottom:0; left:0; width:500px; height:20px;
    background:var(--surface); border-top:1px solid var(--border);
    font-size:10px; color:var(--muted);
    display:flex; align-items:center; padding:0 8px; gap:8px; z-index:4;
  }
  #audio-name{
    font-size:10px; color:var(--green); max-width:80px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="topbar">
    <a id="home-btn" href="index.html">←</a>
    <div id="title">制谱器</div>
    <label class="ctl">BPM<input id="bpm" type="number" value="120" min="60" max="300" step="1"></label>
    <label class="ctl">偏移<input id="offset" type="number" value="0" step="0.01"></label>
    <select class="ctl" id="grid" style="height:24px;font-size:11px;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:0 2px;">
      <option value="1">四分</option>
      <option value="2" selected>八分</option>
      <option value="4">十六分</option>
    </select>
    <button class="btn" id="zoom-out">-</button>
    <button class="btn" id="zoom-in">+</button>
    <button class="btn primary" id="play-btn">▶</button>
    <button class="btn" id="music-btn">音乐</button>
    <button class="btn" id="import-btn">谱</button>
    <button class="btn" id="export-btn">出</button>
    <input type="file" id="audio-file" accept="audio/*" style="display:none">
    <div id="time-display"><b id="cur-time">0.00</b> / <span id="total-time">0.00</span>拍</div>
  </div>
  <canvas id="canvas" width="500" height="311"></canvas>

  <div id="panel">
    <h3 id="panel-title">导出谱面</h3>
    <textarea id="panel-text" readonly placeholder="谱面 JSON"></textarea>
    <div id="panel-actions">
      <button class="btn" id="panel-cancel">关闭</button>
      <button class="btn primary" id="panel-confirm" style="display:none;">加载</button>
      <button class="btn primary" id="panel-copy" style="display:none;">复制</button>
    </div>
  </div>

  <div id="hint-bar">
    <span>左键放</span><span>右键删</span><span>空格播停</span>
    <span>滚轮滚</span><span>Ctrl+滚轮缩放</span>
    <span id="audio-name"></span>
    <span style="margin-left:auto;">D F J K</span>
  </div>
</div>

<script>
/* ============================================================
 *  制谱器（4K 下落式）
 *  - 谱面格式：{m: 小节, b: 小节内拍(1~4), lane}
 *  - 内部用整数拍索引避免浮点误差
 *  - Ctrl+滚轮纵向缩放
 *  - 支持导入音频，播放头跟随音乐
 * ============================================================ */

const chart = {
  offset: 0,
  tempo: 120,
  notes: [],   // {m, b, lane}
};

// ---------- 常量 ----------
const W = 500, H = 311;
const TIME_AXIS_W = 44;
const LANE_AREA_X = TIME_AXIS_W;
const LANE_AREA_W = W - TIME_AXIS_W;
const LANES = 4;
const LANE_W = LANE_AREA_W / LANES;
const NOTE_H = 10;
const DELETE_TOL_BEAT = 0.25;

// ---------- 状态 ----------
const state = {
  playing: false,
  playheadIdx: 0,        // 播放头位置（网格索引）
  scrollIdx: 0,          // 可视范围起点（网格索引）
  zoom: 1,               // 缩放：1=默认，越小越放大
  audioCtx: null,
  audioBuffer: null,
  audioSource: null,
  audioStartTime: 0,     // 音频开始播放时的 ctx.currentTime
  audioStartPlayhead: 0,
};

// ---------- DOM ----------
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const bpmInput = document.getElementById('bpm');
const offsetInput = document.getElementById('offset');
const gridSelect = document.getElementById('grid');
const playBtn = document.getElementById('play-btn');
const musicBtn = document.getElementById('music-btn');
const audioFile = document.getElementById('audio-file');
const importBtn = document.getElementById('import-btn');
const exportBtn = document.getElementById('export-btn');
const zoomInBtn = document.getElementById('zoom-in');
const zoomOutBtn = document.getElementById('zoom-out');
const curTimeEl = document.getElementById('cur-time');
const totalTimeEl = document.getElementById('total-time');
const audioNameEl = document.getElementById('audio-name');
const panel = document.getElementById('panel');
const panelTitle = document.getElementById('panel-title');
const panelText = document.getElementById('panel-text');
const panelCancel = document.getElementById('panel-cancel');
const panelConfirm = document.getElementById('panel-confirm');
const panelCopy = document.getElementById('panel-copy');

// ---------- 网格（用整数索引，避免浮点） ----------
function gridDiv(){ return parseFloat(gridSelect.value) || 2; }
function gridDurBeat(){ return 1 / gridDiv(); }
function visibleBeats(){ return 32 * state.zoom; }   // zoom 越大可见拍数越多（越缩小）
function beatToSec(beat){ return beat * 60 / chart.tempo; }
function secToBeat(sec){ return sec * chart.tempo / 60; }

// 索引 ↔ 拍
function idxToBeat(idx){ return idx * gridDurBeat(); }
function beatToIdx(beat){ return beat / gridDurBeat(); }

// 拍 ↔ Y
function beatToY(beat){
  return (beat - state.scrollIdx * gridDurBeat()) / visibleBeats() * H;
}
function yToBeat(y){
  return state.scrollIdx * gridDurBeat() + y / H * visibleBeats();
}

function xToLane(x){
  const rel = x - LANE_AREA_X;
  if(rel < 0 || rel > LANE_AREA_W) return -1;
  return Math.floor(rel / LANE_W);
}

// 音符索引
function noteIdx(n){ return beatToIdx(n.m * 4 + (n.b - 1)); }
function idxToNote(idx, lane){
  const gb = idx * gridDurBeat();
  return { m: Math.floor(gb / 4), b: (gb % 4) + 1, lane };
}

function totalIdx(){
  if(chart.notes.length === 0) return 0;
  return Math.max(...chart.notes.map(noteIdx));
}

// ---------- 音符操作 ----------
function addNoteAtBeat(beat, lane){
  const idx = Math.round(beatToIdx(beat));
  // 同轨道同一格不重复
  for(const n of chart.notes){
    if(n.lane === lane && noteIdx(n) === idx) return false;
  }
  chart.notes.push(idxToNote(idx, lane));
  chart.notes.sort((a,b) => noteIdx(a) - noteIdx(b));
  return true;
}

function deleteNearBeat(beat, lane){
  const idx = beatToIdx(beat);
  for(let i = chart.notes.length-1; i >= 0; i--){
    const n = chart.notes[i];
    if(n.lane === lane && Math.abs(noteIdx(n) - idx) < Math.ceil(DELETE_TOL_BEAT / gridDurBeat())){
      chart.notes.splice(i, 1);
      return true;
    }
  }
  return false;
}

// ---------- 音频 ----------
function ensureAudioCtx(){
  if(!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(state.audioCtx.state === 'suspended') state.audioCtx.resume();
}

audioFile.addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  ensureAudioCtx();
  const buf = await file.arrayBuffer();
  state.audioBuffer = await state.audioCtx.decodeAudioData(buf);
  audioNameEl.textContent = file.name;
});

musicBtn.addEventListener('click', ()=> audioFile.click());

function startAudio(){
  if(!state.audioBuffer) return;
  ensureAudioCtx();
  stopAudio();
  state.audioSource = state.audioCtx.createBufferSource();
  state.audioSource.buffer = state.audioBuffer;
  state.audioSource.connect(state.audioCtx.destination);
  state.audioStartTime = state.audioCtx.currentTime;
  state.audioStartPlayhead = state.playheadIdx * gridDurBeat();
  state.audioSource.start(0, state.playheadIdx * gridDurBeat() * 60 / chart.tempo);
}
function stopAudio(){
  if(state.audioSource){
    try{ state.audioSource.stop(); }catch(e){}
    state.audioSource = null;
  }
}

// ---------- 播放 ----------
function play(){
  state.playing = true;
  if(state.audioBuffer) startAudio();
  else {
    state.audioStartTime = performance.now() / 1000;
    state.audioStartPlayhead = state.playheadIdx * gridDurBeat();
  }
  playBtn.textContent = '⏸';
}
function pause(){
  state.playing = false;
  stopAudio();
  playBtn.textContent = '▶';
}
function togglePlay(){ state.playing ? pause() : play(); }

function updatePlayhead(){
  if(!state.playing) return;
  let currentBeat;
  if(state.audioBuffer && state.audioCtx){
    const dt = state.audioCtx.currentTime - state.audioStartTime;
    currentBeat = state.audioStartPlayhead + secToBeat(dt);
  } else {
    const dt = performance.now() / 1000 - state.audioStartTime;
    currentBeat = state.audioStartPlayhead + secToBeat(dt);
  }
  state.playheadIdx = Math.round(beatToIdx(currentBeat));
  // 自动滚屏
  const y = beatToY(currentBeat);
  if(y > H * 0.8){
    state.scrollIdx = Math.round(beatToIdx(currentBeat - visibleBeats() * 0.3));
  }
  // 超过最后音符 4 拍停
  if(totalIdx() > 0 && currentBeat > (totalIdx() * gridDurBeat()) + 4){
    pause();
  }
}

// ---------- 渲染 ----------
function draw(){
  ctx.clearRect(0,0,W,H);

  // 轨道背景
  for(let i = 0; i < LANES; i++){
    ctx.fillStyle = (i%2===0) ? '#11141a' : '#0d1015';
    ctx.fillRect(LANE_AREA_X + i*LANE_W, 0, LANE_W, H);
    if(i > 0){
      ctx.strokeStyle = 'rgba(255,255,255,.06)';
      ctx.beginPath();
      ctx.moveTo(LANE_AREA_X + i*LANE_W, 0);
      ctx.lineTo(LANE_AREA_X, H);
      ctx.stroke();
    }
  }
  ctx.strokeStyle = 'rgba(255,255,255,.1)';
  ctx.beginPath(); ctx.moveTo(LANE_AREA_X, 0); ctx.lineTo(LANE_AREA_X, H); ctx.stroke();

  // 网格线（整数索引，避免浮点误差）
  const g = gridDurBeat();
  const startIdx = Math.max(0, Math.floor(state.scrollIdx));
  const endIdx = Math.ceil(state.scrollIdx + visibleBeats() / g);
  ctx.font = '9px -apple-system, "Segoe UI", sans-serif';
  ctx.textAlign = 'left';
  for(let idx = startIdx; idx <= endIdx; idx++){
    const beat = idx * g;
    const y = beatToY(beat);
    if(y < -1 || y > H + 1) continue;
    const beatNum = idx * g;                     // 该网格点的拍数
    const isOnBeat = Math.abs(beatNum - Math.round(beatNum)) < 1e-6;
    const isMeasure = Math.abs(beatNum % 4) < 1e-6;

    ctx.strokeStyle = isMeasure ? 'rgba(91,141,239,.4)'
                    : isOnBeat ? 'rgba(255,255,255,.12)'
                    : 'rgba(255,255,255,.04)';
    ctx.beginPath();
    ctx.moveTo(LANE_AREA_X, y);
    ctx.lineTo(W, y);
    ctx.stroke();

    if(isMeasure){
      ctx.fillStyle = 'rgba(91,141,239,.85)';
      ctx.fillText('M' + Math.round(beatNum/4), 4, y + 3);
    } else if(isOnBeat){
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.fillText('·', 20, y + 3);
    }
  }

  // 音符
  for(const n of chart.notes){
    const beat = n.m * 4 + (n.b - 1);
    const y = beatToY(beat);
    if(y < -NOTE_H || y > H + NOTE_H) continue;
    const x = LANE_AREA_X + n.lane * LANE_W + 6;
    const w = LANE_W - 12;
    ctx.fillStyle = '#5b8def';
    roundRect(ctx, x, y - NOTE_H/2, w, NOTE_H, 3);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.4)';
    roundRect(ctx, x, y - NOTE_H/2, w, 3, 1);
    ctx.fill();
  }

  // 播放头
  const phBeat = state.playheadIdx * g;
  const phY = beatToY(phBeat);
  if(phY >= 0 && phY <= H){
    ctx.fillStyle = '#7ee0a3';
    ctx.fillRect(LANE_AREA_X, phY - 1, LANE_AREA_W, 2);
    ctx.beginPath();
    ctx.moveTo(LANE_AREA_X - 6, phY - 4);
    ctx.lineTo(LANE_AREA_X, phY);
    ctx.lineTo(LANE_AREA_X - 6, phY + 4);
    ctx.closePath();
    ctx.fill();
  }

  // 底部按键
  ctx.fillStyle = 'rgba(255,255,255,.2)';
  ctx.font = '10px -apple-system, "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ['D','F','J','K'].forEach((lb, i)=>{
    ctx.fillText(lb, LANE_AREA_X + i*LANE_W + LANE_W/2, H - 6);
  });
}

function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y, x+w, y+h, r);
  c.arcTo(x+w, y+h, x, y+h, r);
  c.arcTo(x, y+h, x, y, r);
  c.arcTo(x, y, x+w, y, r);
  c.closePath();
}

// ---------- 主循环 ----------
function loop(){
  updatePlayhead();
  draw();
  curTimeEl.textContent = (state.playheadIdx * gridDurBeat()).toFixed(2);
  totalTimeEl.textContent = (totalIdx() * gridDurBeat()).toFixed(2);
  requestAnimationFrame(loop);
}
loop();

// ---------- 鼠标 ----------
canvas.addEventListener('mousedown', (e)=>{
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const my = (e.clientY - rect.top) * (canvas.height / rect.height);
  const lane = xToLane(mx);
  if(lane < 0) return;
  const beat = yToBeat(my);
  if(e.button === 0) addNoteAtBeat(beat, lane);
  else if(e.button === 2) deleteNearBeat(beat, lane);
});
canvas.addEventListener('contextmenu', (e)=> e.preventDefault());

// 滚轮：普通滚动，Ctrl+缩放
canvas.addEventListener('wheel', (e)=>{
  e.preventDefault();
  if(e.ctrlKey){
    // 纵向缩放
    const oldZoom = state.zoom;
    state.zoom = Math.max(0.25, Math.min(4, state.zoom * (e.deltaY > 0 ? 1.15 : 0.87)));
    // 保持鼠标位置对应的拍数不变
    const rect = canvas.getBoundingClientRect();
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);
    const beatAtMouse = yToBeat(my);
    state.scrollIdx = beatToIdx(beatAtMouse - (my / H) * visibleBeats());
    state.scrollIdx = Math.max(0, state.scrollIdx);
  } else {
    const delta = e.deltaY > 0 ? visibleBeats() * 0.15 : -visibleBeats() * 0.15;
    state.scrollIdx = Math.max(0, state.scrollIdx + beatToIdx(delta));
  }
}, { passive:false });

zoomInBtn.addEventListener('click', ()=>{ state.zoom = Math.max(0.25, state.zoom * 0.75); });
zoomOutBtn.addEventListener('click', ()=>{ state.zoom = Math.min(4, state.zoom * 1.33); });

// ---------- 键盘 ----------
window.addEventListener('keydown', (e)=>{
  if(e.code === 'Space' && !e.repeat){ e.preventDefault(); togglePlay(); }
  if(e.code === 'ArrowLeft'){
    state.playheadIdx = Math.max(0, state.playheadIdx - 1);
    if(beatToY(state.playheadIdx * gridDurBeat()) < 0)
      state.scrollIdx = Math.max(0, beatToIdx(state.playheadIdx * gridDurBeat()));
  }
  if(e.code === 'ArrowRight'){
    state.playheadIdx += 1;
    if(beatToY(state.playheadIdx * gridDurBeat()) > H)
      state.scrollIdx = beatToIdx(state.playheadIdx * gridDurBeat() - visibleBeats() * 0.8);
  }
});

// ---------- 顶栏 ----------
bpmInput.addEventListener('change', ()=>{ chart.tempo = parseFloat(bpmInput.value) || 120; });
offsetInput.addEventListener('change', ()=>{ chart.offset = parseFloat(offsetInput.value) || 0; });
playBtn.addEventListener('click', togglePlay);

// ---------- 导入/导出 ----------
function openExport(){
  chart.tempo = parseFloat(bpmInput.value) || 120;
  chart.offset = parseFloat(offsetInput.value) || 0;
  panelTitle.textContent = '导出谱面（{m, b, lane}）';
  panelText.readOnly = true;
  panelText.value = JSON.stringify(chart, null, 2);
  panelConfirm.style.display = 'none';
  panelCopy.style.display = 'inline-block';
  panel.classList.add('show');
}
function openImport(){
  panelTitle.textContent = '导入谱面';
  panelText.readOnly = false;
  panelText.value = '';
  panelText.placeholder = '粘贴 JSON…';
  panelConfirm.style.display = 'inline-block';
  panelCopy.style.display = 'none';
  panel.classList.add('show');
}
function doImport(){
  try{
    const data = JSON.parse(panelText.value);
    chart.notes = data.notes.map(n => {
      if(n.m !== undefined && n.b !== undefined)
        return { m: +n.m, b: +n.b, lane: +n.lane };
      if(n.beat !== undefined){
        const gb = +n.beat;
        return { m: Math.floor(gb/4), b: (gb%4)+1, lane: +n.lane };
      }
      if(n.t !== undefined){
        const gb = secToBeat(+n.t);
        return { m: Math.floor(gb/4), b: (gb%4)+1, lane: +n.lane };
      }
      return null;
    }).filter(n => n && n.lane >= 0 && n.lane <= 3 && n.b >= 1 && n.b <= 4);
    chart.offset = +data.offset || 0;
    chart.tempo = +data.tempo || 120;
    bpmInput.value = chart.tempo;
    offsetInput.value = chart.offset;
    state.scrollIdx = 0; state.playheadIdx = 0;
    panel.classList.remove('show');
  }catch(err){ alert('导入失败：' + err.message); }
}
exportBtn.addEventListener('click', openExport);
importBtn.addEventListener('click', openImport);
panelCancel.addEventListener('click', ()=> panel.classList.remove('show'));
panelConfirm.addEventListener('click', doImport);
panelCopy.addEventListener('click', ()=>{
  panelText.select(); document.execCommand('copy');
});

// ---------- 缩放适配 ----------
const stage = document.getElementById('stage');
function fitStage(){
  const vw = document.documentElement.clientWidth;
  if(vw < 500){
    const s = vw / 500;
    stage.style.transform = 'scale(' + s + ')';
    document.body.style.height = (375 * s) + 'px';
    document.body.style.overflow = 'auto';
  } else {
    stage.style.transform = 'none';
    document.body.style.height = '';
    document.body.style.overflow = 'hidden';
  }
}
window.addEventListener('resize', fitStage);
fitStage();
</script>
</body>
</html>
