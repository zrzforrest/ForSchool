<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048 小游戏</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0f13'/%3E%3Crect x='14' y='14' width='16' height='16' rx='4' fill='%235b8def'/%3E%3Crect x='34' y='14' width='16' height='16' rx='4' fill='%23e06b6b'/%3E%3Crect x='14' y='34' width='16' height='16' rx='4' fill='%23d9a13b'/%3E%3Crect x='34' y='34' width='16' height='16' rx='4' fill='%23e8eaee'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d0f13;
    --surface:#16181d;
    --panel:#1b1e25;
    --border:#2a2e39;
    --border-strong:#363b49;
    --text:#e8eaee;
    --muted:#98a0ad;
    --accent:#5b8def;
    --accent-strong:#4a7fe0;
    --danger:#e06b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden;
  }
  /* ===== 游戏舞台：固定 500×375，贴左上角；窄视口整体缩放 ===== */
  #stage{
    position:absolute;
    top:0;left:0;
    width:500px;height:375px;
    background:var(--bg);
    transform-origin:top left;
  }
  /* ===== 顶栏 ===== */
  #topbar{
    position:absolute;
    top:0;left:0;
    width:500px;height:44px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 12px;
  }
  #home-btn{
    flex:none;
    height:30px;
    padding:0 10px;
    font-size:13px;
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  #home-btn:hover{border-color:var(--border-strong);background:#21242d;}
  #title{font-size:18px;font-weight:700;letter-spacing:1px;flex:none;}
  #score-block{flex:none;display:flex;align-items:baseline;gap:6px;margin-left:auto;}
  #score-label{font-size:12px;color:var(--muted);}
  #score{font-size:16px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;}
  #restart{
    flex:none;
    height:30px;
    padding:0 12px;
    font-size:13px;
    color:#fff;
    background:var(--accent);
    border:1px solid var(--accent);
    border-radius:6px;
    cursor:pointer;
  }
  #restart:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
  /* ===== 4×4 棋盘（306×306，左上角） ===== */
  #board{
    position:absolute;
    top:56px;left:12px;
    width:306px;height:306px;
    background:#171b22;
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px;
  }
  .cell{
    position:absolute;
    width:72px;height:72px;
    border-radius:6px;
    background:#20242e;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    line-height:1;
  }
  .t2{background:#2a2e39;color:#e8eaee;font-size:28px;}
  .t4{background:#33394a;color:#e8eaee;font-size:28px;}
  .t8{background:#5b8def;color:#fff;font-size:28px;}
  .t16{background:#4a7fe0;color:#fff;font-size:26px;}
  .t32{background:#d9a13b;color:#0d0f13;font-size:26px;}
  .t64{background:#e08a3b;color:#0d0f13;font-size:26px;}
  .t128{background:#e06b6b;color:#fff;font-size:24px;}
  .t256{background:#c94f4f;color:#fff;font-size:24px;}
  .t512{background:#a84343;color:#fff;font-size:22px;}
  .t1024{background:#8c3636;color:#fff;font-size:20px;}
  .t2048{background:#e8b33c;color:#0d0f13;font-size:20px;}
  /* ===== 方向按钮（右侧，十字布局） ===== */
  #pad{position:absolute;left:336px;top:56px;width:164px;height:306px;}
  .dir{
    position:absolute;
    width:52px;height:52px;
    border-radius:12px;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    font-size:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    user-select:none;
  }
  .dir:hover{border-color:var(--border-strong);background:#21242d;}
  .dir:active{background:var(--accent);color:#fff;}
  #btn-up{top:0;left:56px;}
  #btn-left{top:72px;left:0;}
  #btn-right{top:72px;left:112px;}
  #btn-down{top:144px;left:56px;}
  #pad-hint{
    position:absolute;
    top:210px;left:0;
    width:164px;
    font-size:11px;
    line-height:1.7;
    color:var(--muted);
  }
  /* ===== 状态浮层（盖在棋盘上） ===== */
  #overlay{
    position:absolute;
    top:56px;left:12px;
    width:306px;height:306px;
    background:rgba(13,15,19,.78);
    border-radius:8px;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    z-index:10;
  }
  #overlay.show{display:flex;}
  #ov-title{font-size:24px;font-weight:700;}
  #ov-sub{font-size:13px;color:var(--muted);}
  #ov-restart{
    height:34px;
    padding:0 16px;
    font-size:14px;
    color:#fff;
    background:var(--accent);
    border:none;
    border-radius:8px;
    cursor:pointer;
  }
  #ov-restart:hover{background:var(--accent-strong);}
  #ov-replay{
    height:34px;
    padding:0 16px;
    font-size:14px;
    color:var(--text);
    background:transparent;
    border:1px solid var(--border-strong);
    border-radius:8px;
    cursor:pointer;
  }
  #ov-replay:hover{background:var(--panel);border-color:var(--accent);}
  /* ===== 回放条（覆盖棋盘，本局结束后查看） ===== */
  #replaybar{
    position:absolute;
    top:56px;left:12px;
    width:306px;height:306px;
    background:rgba(13,15,19,.68);
    border-radius:8px;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    z-index:10;
  }
  #replaybar.show{display:flex;}
  #rp-status{font-size:15px;font-weight:700;letter-spacing:.5px;}
  #rp-step{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  #rp-dir{font-size:13px;color:#d9a13b;}
  #rp-controls{display:flex;gap:8px;}
  #rp-controls button{
    height:32px;
    padding:0 12px;
    font-size:13px;
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:7px;
    cursor:pointer;
  }
  #rp-controls button:hover{border-color:var(--border-strong);background:#21242d;}
  #rp-controls button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  #rp-controls button.primary:hover{background:var(--accent-strong);}
  #rp-exit{
    height:28px;
    padding:0 14px;
    font-size:12px;
    color:var(--muted);
    background:transparent;
    border:1px solid var(--border);
    border-radius:7px;
    cursor:pointer;
  }
  #rp-exit:hover{color:var(--text);border-color:var(--border-strong);}
</style>
</head>
<body>
<div id="stage">
  <div id="topbar">
    <button id="home-btn" type="button" title="返回主页" aria-label="返回主页">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" /></svg>
      主页
    </button>
    <span id="title">2048</span>
    <div id="score-block">
      <span id="score-label">分数</span>
      <span id="score">0</span>
    </div>
    <button id="restart" type="button">新游戏</button>
  </div>
  <div id="board"></div>
  <div id="pad">
    <button id="btn-up" class="dir" type="button" title="上" aria-label="上">▲</button>
    <button id="btn-left" class="dir" type="button" title="左" aria-label="左">◀</button>
    <button id="btn-right" class="dir" type="button" title="右" aria-label="右">▶</button>
    <button id="btn-down" class="dir" type="button" title="下" aria-label="下">▼</button>
    <div id="pad-hint">用四个方向按钮或键盘方向键移动方块，相同数字相撞会合并。</div>
  </div>
  <div id="overlay">
    <div id="ov-title"></div>
    <div id="ov-sub"></div>
    <button id="ov-restart" type="button">再来一局</button>
    <button id="ov-replay" type="button">回放本局</button>
  </div>
  <div id="replaybar">
    <div id="rp-status">回放本局</div>
    <div id="rp-step">第 1 / 1 步</div>
    <div id="rp-dir">开局</div>
    <div id="rp-controls">
      <button id="rp-prev" type="button">◀ 上一步</button>
      <button id="rp-play" class="primary" type="button">播放</button>
      <button id="rp-next" type="button">下一步 ▶</button>
    </div>
    <button id="rp-exit" type="button">退出回放</button>
  </div>
</div>
<script>
(function(){
  const SIZE = 4;
  const board = document.getElementById('board');
  const cells = [];
  for(let r = 0; r < SIZE; r++){
    for(let c = 0; c < SIZE; c++){
      const d = document.createElement('div');
      d.className = 'cell';
      d.style.top  = (6 + r * 78) + 'px';
      d.style.left = (6 + c * 78) + 'px';
      board.appendChild(d);
      cells.push(d);
    }
  }

  const scoreEl  = document.getElementById('score');
  const overlay  = document.getElementById('overlay');
  const ovTitle  = document.getElementById('ov-title');
  const ovSub    = document.getElementById('ov-sub');
  const replaybar = document.getElementById('replaybar');
  const rpStep    = document.getElementById('rp-step');
  const rpDir     = document.getElementById('rp-dir');
  const rpPlay    = document.getElementById('rp-play');

  let grid = [], score = 0, won = false, over = false;
  // ===== 本局回放：记录每一步（方向 + 棋盘快照 + 分数） =====
  let history = [], replaying = false, replayIdx = 0, playTimer = null;
  const DIR_LABEL = { up:'▲', down:'▼', left:'◀', right:'▶' };

  function emptyCells(){
    const a = [];
    grid.forEach(function(v, i){ if(!v) a.push(i); });
    return a;
  }

  function addTile(){
    const a = emptyCells();
    if(!a.length) return;
    const i = a[Math.floor(Math.random() * a.length)];
    grid[i] = Math.random() < 0.9 ? 2 : 4;
  }

  // 单行压缩并合并：0 移到末尾，相邻相同数字合并
  function slide(row){
    const arr = row.filter(function(v){ return v !== 0; });
    const out = [];
    for(let i = 0; i < arr.length; i++){
      if(i + 1 < arr.length && arr[i] === arr[i + 1]){
        out.push(arr[i] * 2);
        score += arr[i] * 2;
        i++;
      } else {
        out.push(arr[i]);
      }
    }
    while(out.length < SIZE) out.push(0);
    return out;
  }

  function move(dir){
    if(over || replaying) return;
    const before = grid.join(',');
    if(dir === 'left' || dir === 'right'){
      for(let r = 0; r < SIZE; r++){
        let row = grid.slice(r * SIZE, r * SIZE + SIZE);
        if(dir === 'right') row = row.reverse();
        row = slide(row);
        if(dir === 'right') row = row.reverse();
        for(let c = 0; c < SIZE; c++) grid[r * SIZE + c] = row[c];
      }
    } else {
      for(let c = 0; c < SIZE; c++){
        let col = [];
        for(let r = 0; r < SIZE; r++) col.push(grid[r * SIZE + c]);
        if(dir === 'down') col = col.reverse();
        col = slide(col);
        if(dir === 'down') col = col.reverse();
        for(let r = 0; r < SIZE; r++) grid[r * SIZE + c] = col[r];
      }
    }
    if(grid.join(',') === before) return;   // 无变化则不生成新方块
    addTile();
    history.push({ dir: dir, grid: grid.slice(), score: score });
    render();
    check();
  }

  function render(){
    grid.forEach(function(v, i){
      const d = cells[i];
      if(v){
        d.textContent = v;
        d.className = 'cell t' + (v > 2048 ? 2048 : v);
      } else {
        d.textContent = '';
        d.className = 'cell';
      }
    });
    scoreEl.textContent = score;
  }

  function showOverlay(t, s){
    ovTitle.textContent = t;
    ovSub.textContent = s;
    overlay.classList.add('show');
  }

  function check(){
    if(!won && grid.some(function(v){ return v >= 2048; })){
      won = true;
      showOverlay('达成 2048！', '可以继续挑战更高分数');
      return;
    }
    if(emptyCells().length) return;
    // 无空格时检查是否还有可合并的相邻方块
    for(let i = 0; i < SIZE * SIZE; i++){
      const c = i % SIZE, r = Math.floor(i / SIZE);
      const right = c < SIZE - 1 ? grid[i + 1] : -1;
      const down  = r < SIZE - 1 ? grid[i + SIZE] : -1;
      if(grid[i] === right || grid[i] === down) return;
    }
    over = true;
    showOverlay('游戏结束', '最终分数 ' + score);
  }

  // ===== 回放控制 =====
  function applyReplay(i){
    replayIdx = i;
    const s = history[i];
    grid = s.grid.slice();
    score = s.score;
    render();
    rpStep.textContent = '第 ' + (i + 1) + ' / ' + history.length + ' 步';
    rpDir.textContent = i === 0 ? '开局' : '本步方向 ' + (DIR_LABEL[s.dir] || '');
    if(i >= history.length - 1) stopPlay();
  }
  function stopPlay(){
    if(playTimer){ clearInterval(playTimer); playTimer = null; }
    rpPlay.textContent = '播放';
  }
  function startPlay(){
    if(playTimer) return;
    if(replayIdx >= history.length - 1) applyReplay(0);
    playTimer = setInterval(function(){
      if(replayIdx < history.length - 1){
        applyReplay(replayIdx + 1);
      } else {
        stopPlay();
      }
    }, 350);
    rpPlay.textContent = '暂停';
  }
  function openReplay(){
    stopPlay();
    overlay.classList.remove('show');
    replaying = true;
    replaybar.classList.add('show');
    applyReplay(0);
  }
  function closeReplay(){
    stopPlay();
    replaying = false;
    replaybar.classList.remove('show');
    if(over){
      ovTitle.textContent = '游戏结束';
      ovSub.textContent = '最终分数 ' + score;
      overlay.classList.add('show');
    } else if(won){
      ovTitle.textContent = '达成 2048！';
      ovSub.textContent = '可以继续挑战更高分数';
      overlay.classList.add('show');
    }
  }

  function newGame(){
    grid = new Array(SIZE * SIZE).fill(0);
    score = 0;
    won = false;
    over = false;
    overlay.classList.remove('show');
    stopPlay();
    replaying = false;
    replaybar.classList.remove('show');
    addTile();
    addTile();
    history = [{ dir: null, grid: grid.slice(), score: 0 }];
    render();
  }

  // ===== 四方向按钮（代替触屏滑动） =====
  document.getElementById('btn-up').onclick    = function(){ move('up'); };
  document.getElementById('btn-down').onclick  = function(){ move('down'); };
  document.getElementById('btn-left').onclick  = function(){ move('left'); };
  document.getElementById('btn-right').onclick = function(){ move('right'); };

  // ===== 键盘方向键（桌面备用操作） =====
  document.addEventListener('keydown', function(e){
    const k = e.key;
    if(k === 'ArrowUp'){ e.preventDefault(); move('up'); }
    else if(k === 'ArrowDown'){ e.preventDefault(); move('down'); }
    else if(k === 'ArrowLeft'){ e.preventDefault(); move('left'); }
    else if(k === 'ArrowRight'){ e.preventDefault(); move('right'); }
  });

  document.getElementById('restart').onclick = newGame;
  document.getElementById('ov-restart').onclick = newGame;
  document.getElementById('ov-replay').onclick = openReplay;
  document.getElementById('rp-prev').onclick = function(){
    stopPlay();
    if(replayIdx > 0) applyReplay(replayIdx - 1);
  };
  document.getElementById('rp-next').onclick = function(){
    stopPlay();
    if(replayIdx < history.length - 1) applyReplay(replayIdx + 1);
  };
  rpPlay.onclick = function(){ playTimer ? stopPlay() : startPlay(); };
  document.getElementById('rp-exit').onclick = closeReplay;
  document.getElementById('home-btn').onclick = function(){ location.href = 'index.html'; };

  // ===== 窄视口整体缩放适配（保险：固定 500×375 左上角布局） =====
  const stage = document.getElementById('stage');
  function fitStage(){
    const vw = document.documentElement.clientWidth;
    if(vw < 500){
      const s = vw / 500;
      stage.style.transform = 'scale(' + s + ')';
      stage.style.width = '500px';
      document.body.style.height = (375 * s) + 'px';
      document.body.style.overflow = 'auto';
    } else {
      stage.style.transform = 'none';
      document.body.style.height = '';
      document.body.style.overflow = 'hidden';
    }
  }
  window.addEventListener('resize', fitStage);
  fitStage();

  newGame();
})();
</script>
</body>
</html>
