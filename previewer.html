<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>固定窗口预览器</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235b8def'/%3E%3Crect x='16' y='18' width='32' height='28' rx='4' fill='white'/%3E%3Crect x='24' y='26' width='16' height='4' rx='2' fill='%235b8def'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d0f13;
    --surface:#16181d;
    --panel:#1b1e25;
    --border:#2a2e39;
    --border-strong:#363b49;
    --text:#e8eaee;
    --muted:#98a0ad;
    --accent:#5b8def;
    --accent-strong:#4a7fe0;
    --danger:#e06b6b;
    /* 尺寸模式变量：主版 800×600，备用版 400×300（body.compact 覆盖） */
    --tool-w:800px; --win-w:800px; --win-h:630px;
    --view-w:800px; --view-h:600px;
    --note-top:692px; --note-w:800px;
  }
  body.compact{
    --tool-w:400px; --win-w:400px; --win-h:330px;
    --view-w:400px; --view-h:300px;
    --note-top:392px; --note-w:400px;
  }
  /* 备用版顶栏较窄，隐藏“网址”标签以留出输入框宽度 */
  body.compact #label{display:none;}
  /* 备用版顶栏更窄，主页按钮仅保留图标 */
  body.compact #home-btn{padding:0 10px;}
  body.compact #home-btn span{display:none;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden;
  }
  /* ===== 页面舞台：移动端整体缩放适配视口 ===== */
  #stage{position:relative;transform-origin:top left;}
  /* ===== 顶部输入栏（绝对坐标，贴左上角） ===== */
  #topbar{
    position:absolute;
    top:0;left:0;
    width:var(--tool-w);height:54px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 14px;
  }
  #label{
    font-size:13px;
    color:var(--muted);
    flex:none;
    white-space:nowrap;
  }
  #url-input{
    flex:1;
    min-width:0;
    height:32px;
    padding:0 12px;
    font-size:14px;
    color:var(--text);
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:6px;
    outline:none;
  }
  #url-input:focus{border-color:var(--accent);}
  #url-input::placeholder{color:#5f6673;}
  .btn{
    flex:none;
    height:32px;
    padding:0 14px;
    font-size:13px;
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn:hover{border-color:var(--border-strong);background:#21242d;}
  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
  /* ===== 预览窗口（800×600，贴左上角，绝对坐标） ===== */
  #window{
    position:absolute;
    top:54px;left:0;
    width:var(--win-w);height:var(--win-h);
    background:var(--surface);
    border:1px solid var(--border-strong);
    border-radius:8px 8px 0 0;
    box-shadow:0 8px 28px rgba(0,0,0,.45);
    overflow:hidden;
  }
  #win-titlebar{
    position:absolute;
    top:0;left:0;
    width:100%;height:30px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 10px;
  }
  #win-dots{display:flex;gap:5px;flex:none;}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .dot-r{background:#e06b6b;}
  .dot-y{background:#d9a13b;}
  .dot-g{background:#5da95f;}
  #win-url{
    flex:1;min-width:0;
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  #win-refresh{
    flex:none;
    width:22px;height:22px;
    background:transparent;
    border:none;
    color:var(--muted);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:4px;
  }
  #win-refresh:hover{color:var(--text);background:var(--border);}
  #zoom-group{flex:none;display:flex;align-items:center;gap:2px;}
  .zoom-btn{
    width:22px;height:22px;
    background:transparent;
    border:none;
    color:var(--muted);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:4px;
    font-size:15px;line-height:1;
  }
  .zoom-btn:hover{color:var(--text);background:var(--border);}
  #zoom-val{
    min-width:42px;text-align:center;
    font-size:12px;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  /* ===== 可滚动视口（使用页面原生滚动条，浏览器默认位置：右侧垂直、底部水平） ===== */
  #viewport{
    position:absolute;
    top:30px;left:0;
    width:var(--view-w);height:var(--view-h);
    overflow:auto;
    background:#fff;               /* 模拟浏览器页面背景：缩放后留白区域显示为白色（同电脑浏览器缩小固定宽站点的观感） */
  }
  #frame{
    position:absolute;
    top:0;left:0;
    width:var(--view-w);height:var(--view-h);
    border:0;background:#fff;
  }
  /* ===== 右下角说明（绝对坐标） ===== */
  #note{
    position:absolute;
    top:var(--note-top);left:0;
    width:var(--note-w);
    padding:10px 14px;
    font-size:12px;
    line-height:1.6;
    color:var(--muted);
  }
  /* ===== Toast（绝对坐标，居中顶部） ===== */
  #toast{
    position:absolute;
    top:64px;left:50%;
    transform:translateX(-50%);
    max-width:70%;
    padding:8px 16px;
    font-size:13px;
    color:#fff;
    background:var(--danger);
    border-radius:6px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s;
    white-space:nowrap;
  }
  #toast.show{opacity:1;}
</style>
</head>
<body>
<div id="stage">
<!-- ===== 顶部输入栏 ===== -->
<div id="topbar">
  <button id="home-btn" class="btn" type="button" title="返回主页" aria-label="返回主页">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" /></svg>
    <span>主页</span>
  </button>
  <button id="mode-btn" class="btn" type="button" aria-label="切换版本"></button>
  <span id="label">网址</span>
  <input id="url-input" type="text" placeholder="输入网址预览（如 https://www.baidu.com）" spellcheck="false" autocomplete="off">
  <button id="load-btn" class="btn btn-primary">加载</button>
  <button id="refresh-btn" class="btn">刷新</button>
</div>
<!-- ===== 预览窗口 ===== -->
<div id="window">
  <div id="win-titlebar">
    <div id="win-dots">
      <span class="dot dot-r"></span>
      <span class="dot dot-y"></span>
      <span class="dot dot-g"></span>
    </div>
    <span id="win-url">尚未加载</span>
    <div id="zoom-group">
      <button id="zoom-out" class="zoom-btn" title="缩小" aria-label="缩小">−</button>
      <span id="zoom-val">100%</span>
      <button id="zoom-in" class="zoom-btn" title="放大" aria-label="放大">+</button>
    </div>
    <button id="win-refresh" title="重新加载" aria-label="重新加载">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" /></svg>
    </button>
  </div>
  <!-- 可滚动视口：内容超出 800×600 时由页面原生滚动条滚动（浏览器默认位置：右侧/底部） -->
  <div id="viewport">
    <iframe id="frame" title="预览网页" scrolling="no"></iframe>
  </div>
</div>
<!-- ===== 说明 ===== -->
<div id="note">
  顶部栏固定为 800px（最左到最右的「刷新」按钮正好 800px）；预览窗口 800×600 紧贴左上角，内容超出时由页面原生滚动条滚动查看（浏览器默认位置：右侧垂直、底部水平）。「+」「−」可缩放页面显示。部分网站通过 X-Frame-Options / CSP 禁止被嵌入，此类页面会显示为空白。
</div>
<div id="toast"></div>
</div>
<script>
(function(){
  // 内置响应式演示页：宽度随视口 100% 伸缩（无最大宽度限制），缩放任意比例均铺满预览窗格，且无跨域嵌入限制
  const DEMO = `
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;background:#f7f8fa;color:#1a2333;}
header{background:#2f6fed;color:#fff;padding:16px 24px;font-size:19px;font-weight:700;}
nav{background:#fff;border-bottom:1px solid #e2e6ee;padding:8px 24px;font-size:13px;color:#4a5568;display:flex;gap:18px;}
main{padding:22px 24px;}
h1{font-size:24px;margin:4px 0 10px;}
p{line-height:1.7;color:#374151;margin:10px 0;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px;}
@media (max-width:700px){.grid{grid-template-columns:1fr;}}
.box{background:#fff;border:1px solid #e2e6ee;border-radius:10px;padding:16px;}
.box h3{margin:0 0 8px;font-size:15px;}
.box p{font-size:13px;color:#6b7280;margin:0;}
.btn{display:inline-block;margin-top:14px;background:#2f6fed;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:13px;}
</style>
</head>
<body>
<header>示例门户 · 响应式演示</header>
<nav>首页 新闻 科技 财经 视频 更多</nav>
<main>
<h1>内置响应式示例页</h1>
<p>用预览器右上角的「+」「−」缩放本页：这是浏览器式缩放，文字会按新的布局宽度重新折行，下方卡片在窄布局下会从三列堆叠为单列，页面始终铺满整个预览窗格。</p>
<p>本页由预览器内置，不受 X-Frame-Options 限制；输入任意网址可加载真实站点，真实站点缩小后若出现留白属浏览器正常行为。</p>
<div class="grid">
  <div class="box"><h3>卡片一</h3><p>第一列内容，随视口宽度变化。</p></div>
  <div class="box"><h3>卡片二</h3><p>第二列内容，窄视口下自动堆叠。</p></div>
  <div class="box"><h3>卡片三</h3><p>第三列内容，始终铺满窗格。</p></div>
</div>
<button class="btn">了解详情</button>
</main>
</body>
</html>
`;
  const input    = document.getElementById('url-input');
  const loadBtn  = document.getElementById('load-btn');
  const refreshBtn = document.getElementById('refresh-btn');
  const frame    = document.getElementById('frame');
  const viewport = document.getElementById('viewport');
  const winUrl   = document.getElementById('win-url');
  const winRefresh = document.getElementById('win-refresh');
  const toast    = document.getElementById('toast');
  const zoomIn   = document.getElementById('zoom-in');
  const zoomOut  = document.getElementById('zoom-out');
  const zoomVal  = document.getElementById('zoom-val');
  const homeBtn  = document.getElementById('home-btn');
  const modeBtn  = document.getElementById('mode-btn');
  const noteEl   = document.getElementById('note');
  const stage    = document.getElementById('stage');

  let toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2400);
  }

  function normalize(url){
    url = url.trim();
    if(!url) return '';
    if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
    return url;
  }

  function load(url){
    let target = url || normalize(input.value);
    if(!target){ showToast('请先输入网址'); return; }
    if(!/^https?:\/\//i.test(target)) target = 'https://' + target;
    frame.removeAttribute('srcdoc');   // 切回外部网址加载
    frame.src = target;
    winUrl.textContent = target;
    winUrl.title = target;
  }
  function reload(){
    if(frame.getAttribute('srcdoc') !== null){
      frame.srcdoc = frame.getAttribute('srcdoc');   // 重新渲染内置演示页
    } else if(frame.src){
      load(frame.getAttribute('src'));
    }
  }

  loadBtn.onclick = function(){ load(); };
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ load(); }
  });
  refreshBtn.onclick = reload;
  winRefresh.onclick = reload;

  // ===== 尺寸模式：主版 800×600；备用版 400×300（URL 带 ?size=600） =====
  const compact = new URLSearchParams(location.search).get('size') === '600';
  document.body.classList.toggle('compact', compact);
  document.title = compact ? '固定窗口预览器（400×300 备用版）' : '固定窗口预览器';
  const BASE_W = compact ? 400 : 800;
  const BASE_H = compact ? 300 : 600;
  const zoomSupported = 'zoom' in document.documentElement.style;   // Chromium / Safari / Firefox 126+ 支持 reflow 缩放
  let zoom = 1;

  function isDemo(){ return frame.getAttribute('srcdoc') !== null; }

  function applyZoom(){
    if(isDemo() && frame.contentDocument && frame.contentDocument.documentElement){
      // 内置演示页（同源）：缩放应用到文档根元素 = 页面级缩放（同浏览器 Ctrl 缩放），
      // 内容按新布局宽度重新排版，视觉始终铺满整个预览窗格
      frame.style.zoom = '';   // 清除 iframe 级 zoom，避免双重缩放
      frame.contentDocument.documentElement.style.zoom = zoom;
    } else if(zoomSupported){
      // 外部站点（跨域）：iframe 级 zoom，内容同样重新排版；缩放后内容小于窗口属浏览器真实行为
      frame.style.zoom = zoom;
    }
  }

  function applySize(){
    // 布局尺寸固定：iframe 完整渲染（高 = 窗口高 +300px 供原生滚动条滚动查看长内容）；
    // 宽度让出右侧原生垂直滚动条宽度（约 16px），避免出现水平滚动条
    frame.style.width  = (BASE_W - 16) + 'px';
    frame.style.height = (BASE_H + 300) + 'px';
    if(zoomSupported){
      frame.style.transform = 'none';
      applyZoom();
    } else {
      // 兜底（不支持 zoom 的浏览器）：退化为视觉等比缩放
      frame.style.zoom = '';
      frame.style.transform = 'scale(' + zoom + ')';
      frame.style.transformOrigin = 'top left';
    }
    zoomVal.textContent = Math.round(zoom * 100) + '%';
  }
  frame.addEventListener('load', applySize);

  zoomIn.onclick  = function(){ zoom = Math.min(4, +(zoom * 1.1).toFixed(4)); applySize(); };
  zoomOut.onclick = function(){ zoom = Math.max(0.2, +(zoom / 1.1).toFixed(4)); applySize(); };

  // ===== 移动端适配：界面整体缩放铺满视口宽度 =====
  function fitStage(){
    const vw = document.documentElement.clientWidth;
    const stageW = compact ? 400 : 800;
    if(vw < stageW){
      const s = vw / stageW;
      const h = 54 + (compact ? 330 : 630) + 64;   // topbar + 窗口 + 说明 布局高
      stage.style.transform = 'scale(' + s + ')';
      stage.style.transformOrigin = 'top left';
      stage.style.width = stageW + 'px';
      stage.style.height = (h * s) + 'px';
      document.body.style.height = (h * s) + 'px';
      document.body.style.overflow = 'auto';
    } else {
      stage.style.transform = 'none';
      stage.style.width = '';
      stage.style.height = '';
      document.body.style.height = '';
      document.body.style.overflow = 'hidden';
    }
  }
  window.addEventListener('resize', fitStage);
  fitStage();

  // ===== 版本切换按钮 + 说明文字 =====
  modeBtn.textContent = compact ? '← 返回 800×600' : '400×300 备用版';
  modeBtn.title = compact ? '返回主版本（800×600 窗口）' : '切换到备用版（400×300 窗口）';
  homeBtn.addEventListener('click', function(){ location.href = 'index.html'; });
  modeBtn.addEventListener('click', function(){
    location.href = compact ? location.pathname : location.pathname + '?size=600';
  });
  noteEl.innerHTML = '顶部栏固定为 ' + BASE_W + 'px（最左到最右的「刷新」按钮正好 ' + BASE_W + 'px）；预览窗口 ' + BASE_W + '×' + BASE_H + ' 紧贴左上角，内容超出时由页面原生滚动条滚动查看（浏览器默认位置：右侧垂直、底部水平）。「+」「−」可缩放页面显示。部分网站通过 X-Frame-Options / CSP 禁止被嵌入，此类页面会显示为空白。';

  // 默认加载内置响应式演示页（同源、宽度随视口伸缩，缩放任意比例均铺满预览窗格）
  frame.srcdoc = DEMO;
  winUrl.textContent = '内置响应式演示页';
  winUrl.title = '内置响应式演示页（缩放任意比例铺满窗口）';
  applySize();   // srcdoc 设置后再应用布局与缩放，避免内置页被误设 iframe 级 zoom
})();
</script>
</body>
</html>
