<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>固定窗口预览器 · ForSchool</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235b8def'/%3E%3Crect x='16' y='18' width='32' height='28' rx='4' fill='white'/%3E%3Crect x='24' y='26' width='16' height='4' rx='2' fill='%235b8def'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d0f13;
    --surface:#16181d;
    --panel:#1b1e25;
    --border:#2a2e39;
    --border-strong:#363b49;
    --text:#e8eaee;
    --muted:#98a0ad;
    --accent:#5b8def;
    --accent-strong:#4a7fe0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden;
  }
  /* ===== 主页舞台：固定 760px 宽，贴左上角；窄视口整体缩放 ===== */
  #stage{
    position:absolute;
    top:0;left:0;
    width:760px;
    padding:26px 20px 16px;
    background:var(--bg);
    transform-origin:top left;
  }
  .hero{text-align:center;margin-bottom:14px;}
  .hero h1{font-size:20px;font-weight:700;letter-spacing:.5px;}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 12px;
    display:flex;
    flex-direction:column;
    gap:8px;
    transition:border-color .15s, background .15s;
  }
  .card:hover{border-color:var(--border-strong);background:var(--panel);}
  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .card .size{
    flex:none;
    font-size:10px;
    font-weight:600;
    color:var(--accent);
    background:rgba(91,141,239,.12);
    border:1px solid rgba(91,141,239,.35);
    border-radius:999px;
    padding:2px 7px;
  }
  .card h2{font-size:13px;font-weight:600;}
  .card.wide{grid-column:1 / -1;}
  .enter{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    height:24px;
    font-size:12px;
    color:#fff;
    text-decoration:none;
    background:var(--accent);
    border-radius:6px;
    transition:background .15s;
  }
  .enter:hover{background:var(--accent-strong);}
</style>
</head>
<body>
<div id="stage">
  <header class="hero">
    <h1>固定窗口预览器 · ForSchool</h1>
  </header>
  <div class="cards">
    <section class="card">
      <div class="card-head">
        <h2>2048</h2>
        <span class="size">小游戏</span>
      </div>
      <a class="enter" href="2048.html">开始游戏</a>
    </section>
    <section class="card">
      <div class="card-head">
        <h2>数字华容道</h2>
        <span class="size">小游戏</span>
      </div>
      <a class="enter" href="huarongdao.html">开始游戏</a>
    </section>
    <section class="card">
      <div class="card-head">
        <h2>2048 教程</h2>
        <span class="size">教程</span>
      </div>
      <a class="enter" href="2048-guide.html">查看教程</a>
    </section>
    <section class="card">
      <div class="card-head">
        <h2>华容道教程</h2>
        <span class="size">教程</span>
      </div>
      <a class="enter" href="huarongdao-guide.html">查看教程</a>
    </section>
    <section class="card">
      <div class="card-head">
        <h2>音游</h2>
        <span class="size">小游戏</span>
      </div>
      <a class="enter" href="rhythm.html">进入音游</a>
    </section>
    <section class="card">
      <div class="card-head">
        <h2>备用版</h2>
        <span class="size">400 × 300</span>
      </div>
      <a class="enter" href="previewer.html?size=600">进入 400×300 备用版</a>
    </section>
    <section class="card wide">
      <div class="card-head">
        <h2>主版</h2>
        <span class="size">800 × 600</span>
      </div>
      <a class="enter" href="previewer.html">进入 800×600 主版</a>
    </section>
  </div>
</div>
<script>
  // 兼容旧入口：index.html?size=600 跳转到备用版预览器
  if (new URLSearchParams(location.search).get('size') === '600') {
    location.replace('previewer.html?size=600');
  }
  // ===== 窄视口整体缩放适配（主页固定 760px 宽，贴左上角） =====
  var stage = document.getElementById('stage');
  function fitStage(){
    var vw = document.documentElement.clientWidth;
    if(vw < 760){
      var s = vw / 760;
      stage.style.transform = 'scale(' + s + ')';
      document.body.style.height = (stage.offsetHeight * s) + 'px';
      document.body.style.overflow = 'auto';
    } else {
      stage.style.transform = 'none';
      document.body.style.height = '';
      document.body.style.overflow = 'auto';   // 桌面：视口较矮时允许原生滚动
    }
  }
  window.addEventListener('resize', fitStage);
  fitStage();
</script>
</body>
</html>
